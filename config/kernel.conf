# mochiOS policy passed to the mnu System Domain kernel.
capability.path.binary=/bin
capability.path.binary=/applications
capability.path.system=/system
capability.path.libraries=/libraries
capability.path.tmp=/tmp
# The named tmp capabilities, not fs.write.all, govern /tmp access.
capability.path=/tmp;fs.read.tmp;fs.write.tmp;none
capability.path.config=/config
capability.path.var=/var
capability.path.mount=/mount
capability.path.user=/home

policy.identity_storage_root=/libraries/applications
policy.execution_allowlist=/libraries/system/execution.allowlist
policy.audit_log=/system/logs/audit.log
policy.process_aliases=/config/drivers.list
